name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The actions are named by their commit, a changed tag can not change what runs here
# with the right to write the image.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Before anything is published: build for the runner's architecture, start it and ask it
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: it-tools:test
          cache-from: type=gha

      - name: Start the image and ask it
        run: |
          docker run -d --name it-tools \
            --user 1234:1234 \
            --security-opt no-new-privileges:true --cap-drop ALL \
            --read-only --tmpfs /tmp \
            -p 8080:8080 it-tools:test
          for attempt in $(seq 30); do
            curl -fsS http://127.0.0.1:8080/ > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<title>'
          curl -fsS http://127.0.0.1:8080/base64-string-converter | grep -qi '<title>'
          docker logs it-tools
          docker rm -f it-tools

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Only latest: with a second tag GitHub shows that one in "Install from the command line"
          tags: ghcr.io/gatzenga/it-tools:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
